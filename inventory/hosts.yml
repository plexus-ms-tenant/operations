# The inventory groups are the ones the shipped playbooks target (§ 1
# PLX-Platform): `platform` for the hosts that run this tenant's apps. A
# host's own facts go to host_vars/<host>.yml, a group's to group_vars/<group>.yml.
platform:
  hosts:
    vm102: # guest on the damage tenant's srv01, reached over the NetBird overlay
      ansible_host: vm102.damage.internal
