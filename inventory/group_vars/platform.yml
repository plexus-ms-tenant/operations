# The hosts that run this tenant's apps (PLX-Platform). The apps themselves
# are per host (host_vars/<host>.yml, plexus_apps).

# Unprivileged user that owns app dirs and runs the deploy verb (via CI SSH).
plexus_deploy_user: plexus
plexus_deploy_root: /opt/stacks

# Re-create containers during a platform-playbook run (rotation — PLX-Secrets)
# and pull + start apps whose compose file the deploy verb has already placed.
# Safe to leave true: an app never deployed yet is skipped, not fatal.
plexus_up: true

# Where the deploy verb reaches a VM, ssh://<deploy user>@<address>[:<port>];
# set per VM in host_vars next to its plexus_apps, so each third-party app
# deploys to the VM that runs it (§ 3 PLX-Platform), and an app repo's
# release finds its apps' targets here too. An app whose file names none has
# no deployment.
# plexus_deploy_target: ssh://plexus@203.0.113.10:2201

# Apps on a host — one record per app, the app's whole platform binding
# (§ 3 PLX-Platform), in the host's host_vars next to its plexus_deploy_target:
# the deploy-targets reader binds a record to the target of the same file.
# The app's run shape (compose.yaml) is NOT here: it lives in the app's source
# repo and the deploy verb renders it onto the host (§ 2 PLX-App).
# App names are unique per tenant across every repo; a record may carry an
# `environment` (production when absent), and the same app may have one
# record per environment (PLX-Environment).
#
#   - name: my-app                          # unique per tenant
#     repo: plexus-ms-tenant/web            # source repo (informative — where the app's code lives)
#     host: my-app.example.org              # ingress: the public host, TLS + route → loopback port
#     loopback_port: 3000                   # 127.0.0.1 port the app publishes, unique per VM
#     env:                                  # non-secret values → .env
#       PUBLIC_URL: https://my-app.example.org
#     secrets:                              # op:// pointers → .env.secret (0600), resolved from the vault
#       DATABASE_URL: op://plexus/my-app/production/database-url
#
#   - name: uptime                          # a third-party app: source repo is THIS repo, apps/uptime/
#     repo: plexus-ms-tenant/operations
#     host: ops.example.org
#     path: /uptime                         # optional: served under ops.example.org/uptime/, prefix stripped;
#                                           # apps sharing a host differ by path, at most one serves its root
#     loopback_port: 3001
#     healthz: /api/status-page/heartbeat   # mirrors the app's plexus.healthz label, so the proxy fences it (§ 5 PLX-App)
plexus_apps: []

# Secrets
plexus_deploy_pubkey: "{{ lookup('env', 'DEPLOY_PUBKEY') | default('', true) }}"
plexus_ghcr_user: "{{ lookup('env', 'GHCR_USER') | default('', true) }}"
plexus_ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"

# Reboot by itself at night when an upgrade asks for it.
upgrades_automatic_reboot: true

# What sits in front of the host (PLX-Ingress): the damage tenant's ingress VM
# routes by SNI and announces the real peer with the PROXY protocol; the
# public host is Cloudflare-proxied, so the client address is taken from
# CF-Connecting-IP when the peer is one of Cloudflare's ranges.
ingress_proxy_protocol_from: [10.10.0.0/24]
ingress_trusted_proxies: cloudflare
