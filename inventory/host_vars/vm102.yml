# vm102: the one host of the tenant, a guest on the damage tenant's srv01.
# The deploy verb reaches it through the public SSH forward of the damage
# ingress VM (port 2102 → vm102:22), as the forge's runners sit outside the
# overlay (§ 8 PLX-Delivery, strategy github without an overlay).
plexus_deploy_target: ssh://plexus@51.68.107.4:2102

# Apps on this host (§ 3 PLX-Platform); the record shape is documented in
# group_vars/plexus.yml.
plexus_apps:
  - name: website
    repo: plexus-ms-tenant/web
    host: plexus-ms.org
    loopback_port: 3000
    secrets:
      REVALIDATE_TOKEN: op://plexus/website-revalidate/credential
